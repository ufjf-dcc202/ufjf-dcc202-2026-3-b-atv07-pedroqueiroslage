<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Linha</title>
</head>
<body>
    <main> 
        <h1>DCC202 CSS Em Linha</h1>
        <p>Você pode aplicar um estilo <em style="color: blueviolet;">em linha</em> para um elemento usando o atributo <code style="color:darkred ; text-decoration: underline;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
        style</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera a cor do texto do elemento.</dd>
            </div>
            <div>
                <dt>background-color</dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
